# Production image, built on GitHub's runners instead of the production host (step 13.73): the host has
# 5.4 GB for every project on it, and a Nixpacks build there (composer, npm ci, vite, image export) took
# a deploy from 2-3 minutes to 25. The build is the one Coolify ran: Nixpacks 1.41.0 with the same
# NIXPACKS_* settings and start command. No secrets go into the image; Coolify passes them at run time.
#
# When the COOLIFY_TOKEN secret is set, the last step asks Coolify to deploy the new image (the
# application's build pack is then "Docker Image" ghcr.io/fahares/fahares:latest, and Coolify runs the
# migrations in its post-deployment command as before).
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/fahares/fahares
  NIXPACKS_VERSION: 1.41.0

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Nixpacks
        run: |
          curl -fsSL "https://github.com/railwayapp/nixpacks/releases/download/v${NIXPACKS_VERSION}/nixpacks-v${NIXPACKS_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | sudo tar xz -C /usr/local/bin nixpacks
          nixpacks --version

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build
        run: |
          docker pull "$IMAGE:latest" || true
          nixpacks build . \
            --name "$IMAGE:${GITHUB_SHA}" --tag "$IMAGE:latest" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --env IS_LARAVEL=yes \
            --env NIXPACKS_NODE_VERSION=22 \
            --env NIXPACKS_PHP_EXTENSIONS=pdo_mysql,intl,bcmath,pcntl,zip,curl,iconv,mbstring \
            --env NIXPACKS_PHP_FALLBACK_PATH=/index.php \
            --env NIXPACKS_PHP_ROOT_DIR=/app/public \
            --start-cmd "bash /app/docker/start.sh" \
            --inline-cache --cache-from "$IMAGE:latest"

      - name: Smoke test
        run: |
          docker run --rm --entrypoint /bin/bash "$IMAGE:${GITHUB_SHA}" -l -c \
            'php -v | head -1 && php -m | grep -qi pdo_mysql && nginx -v && test -f /app/public/build/manifest.json && cd /app && php artisan --version'

      - name: Push
        run: docker push --all-tags "$IMAGE"

      - name: Deploy on Coolify
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
        if: env.COOLIFY_TOKEN != ''
        run: |
          curl -fsS -X POST -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            "${COOLIFY_URL}/api/v1/deploy?uuid=9qjcshcsq1hcstpoorqvkew6&force=false"
