; Upload limits for the admin image forms (largest rule: 5 MB per image, up to 20 images per post upload).
; Passed as -d flags to php-fpm by docker/start.sh (production) and to php -S by App\Console\Commands\ServeCommand (artisan serve).
upload_max_filesize = 10M
post_max_size = 110M
max_file_uploads = 20
