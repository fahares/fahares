# Production web server (item 77): nginx in front of the php-fpm pool in docker/php-fpm.conf.
# A template: docker/start.sh fills the @...@ placeholders and writes the result to /tmp/nginx.conf.
# Workers run as root, as php -S did: some facsimile directories on the uploads volume are not
# world-readable (masjid-azam-ostadi v01 and v03 on 24 Oct 2026), and nobody would get 403 on them
user root;
worker_processes 2;
daemon off;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    include @MIME_TYPES@;
    default_type application/octet-stream;

    log_format main '$http_x_forwarded_for [$time_local] $status "$request" $body_bytes_sent $request_time "$http_user_agent"';
    access_log /dev/stdout main;

    # Crawlers (25 Oct 2026): Meta's AI crawler, Amazonbot, Applebot and others fetched every
    # sort/page variant of the work pages, filled the php-fpm queue, and /up timed out, so Coolify's
    # proxy dropped the app ("no available server"). Meta's crawler gets 403; the others share one
    # bucket per crawler (all its IPs together), so they cannot take more than a few workers.
    # Search engines (Googlebot, bingbot) are not limited.
    map $http_user_agent $blocked_bot {
        default 0;
        ~*meta-externalagent 1;
    }
    map $http_user_agent $bot_name {
        default "";
        ~*(amazonbot|applebot|dataforseobot|reflectionbot|claudebot|gptbot|ccbot|bytespider|petalbot|ahrefsbot|semrushbot|mj12bot|dotbot|facebookexternalhit) $1;
    }
    limit_req_zone $bot_name zone=bots:1m rate=20r/m;
    limit_req_status 429;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json application/xml image/svg+xml;

    server {
        listen @PORT@;
        listen [::]:@PORT@;
        root @ROOT@/public;
        index index.php;
        charset utf-8;

        # post_max_size of docker/php/uploads.ini, so the limit is PHP's, not nginx's (default 1M)
        client_max_body_size @BODY_SIZE@;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Vite assets have a content hash in their names
        location /build/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        error_page 404 /index.php;

        location = /index.php {
            # Only pages are refused or limited: robots.txt and static files stay open to every crawler
            if ($blocked_bot) {
                return 403;
            }
            limit_req zone=bots burst=10 nodelay;
            fastcgi_pass 127.0.0.1:9000;
            include @FASTCGI_PARAMS@;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param HTTP_PROXY "";
            fastcgi_read_timeout 130s;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }

        # No other PHP file under public/ is executed
        location ~ \.php$ {
            return 404;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
