# Answers every request with the "temporarily unavailable" page and 503, so crawlers retry later
# and do not index it. See docker/down/compose.yml.
server {
    listen 80;
    root /usr/share/nginx/html;

    location / {
        return 503;
    }

    error_page 503 /index.html;
    location = /index.html {
        internal;
        add_header Retry-After 120 always;
        add_header Cache-Control "no-store" always;
    }
}
