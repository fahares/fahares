; Production PHP pool (item 77), started by docker/start.sh. The upload limits of docker/php/uploads.ini
; are passed by start.sh as -d flags, like artisan serve does locally.
[global]
error_log = /proc/self/fd/2
log_limit = 8192

[www]
; The container runs as root (start.sh passes -R), as artisan serve did: storage/ and the uploads
; volume are root-owned, and artisan commands run by the scheduler write the same log files.
listen = 127.0.0.1:9000

; 2 CPUs; most of a page's time is spent waiting on MariaDB and Meilisearch
pm = dynamic
pm.max_children = 6
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 4
pm.max_requests = 500

; A hung request cannot hold a worker for ever; max_execution_time (start.sh) stops PHP code first
request_terminate_timeout = 150s

; Coolify passes the configuration as environment variables (there is no .env in production)
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
