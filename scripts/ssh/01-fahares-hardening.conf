# /etc/ssh/sshd_config.d/01-fahares-hardening.conf
# Keys only. sshd keeps the first value it reads, and the main config includes this folder at its top,
# so this file must sort before 50-cloud-init.conf (which turns passwords back on).
# Coolify logs in as root from its container with a key, so root stays allowed, but not with a password.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
X11Forwarding no
